[project]
name = "ttmf-backend"
version = "0.1.0"
description = "TalkToMyFinances Python backend: local BankSync mock, HTTP client, auditor engine"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn>=0.30,<1",
    "httpx>=0.27,<1",
    "python-dotenv>=1,<2",
    "google-genai>=0.1.0",
    "pydantic>=2.0,<3",
]

[tool.uv]
# This is a flat app (mock + client run as modules, not installed as a package).
package = false

[dependency-groups]
dev = ["pytest>=8,<10", "jsonschema>=4,<5"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
