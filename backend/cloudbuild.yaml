# Cloud Build pipeline for the BankSync mock -> Cloud Run.
#
# Submit from the repo root:
#   gcloud builds submit backend \
#     --config backend/cloudbuild.yaml \
#     --substitutions _MOCK_KEY=mock-key,REGION=australia-southeast1
#
# or wire this into the GitHub Actions / Cloud Build trigger of the monorepo
# with the same substitutions. Requires:
#   gcloud config set artifacts/repository <your-arthub-repo>   (Artifact Registry)
#
# NOTE: for a hackathon-prototype mock with a dummy key we leave the service
# reachable and gate it with the X-API-Key header in the app itself. If this
# ever serves real bank data, add --no-allow-unauthenticated (and an
# Identity-Aware Proxy policy) and pass the key as a KMS secret instead of a
# plain --env substitution.

substitutions:
  _SERVICE: ttmf-banksync-mock
  _MOCK_KEY: mock-key
  REGION: australia-southeast1

steps:
  - name: gcr.io/cloud-builders/docker
    args:
      [
        "build",
        "-t", "${LOCATION}-docker.pkg.dev/${PROJECT_ID}/${_AR_REPO}/$_SERVICE:$COMMIT_SHA",
        "--pull",
        ".",
      ]
    dir: backend

  - name: gcr.io/cloud-builders/docker
    args: ["push", "${LOCATION}-docker.pkg.dev/${PROJECT_ID}/${_AR_REPO}/$_SERVICE:$COMMIT_SHA"]
    dir: backend

  - name: gcr.io/cloud-builders/gcloud
    args:
      [
        "run",
        "deploy",
        "$(_SERVICE)",
        "--image",
        "${LOCATION}-docker.pkg.dev/${PROJECT_ID}/${_AR_REPO}/$_SERVICE:$COMMIT_SHA",
        "--region",
        "$(REGION)",
        "--memory",
        "512Mi",
        "--min-instances",
        "1",
        "--env",
        "BANKSYNC_MOCK_KEY=$(_MOCK_KEY)",
      ]
