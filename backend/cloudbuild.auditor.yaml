# Cloud Build pipeline for the Auditor & Curation API -> Cloud Run.
#
# Submit from the REPO ROOT (the auditor image needs the repo-root prompts/
# directory, which is not inside backend/):
#   gcloud builds submit . --config backend/cloudbuild.auditor.yaml
#
# Upload size is controlled by the repo-root .gcloudignore (gcloud builds
# submit has no --exclude flag); the build context by .dockerignore.
#
# Prerequisite: the GEMINI_API_KEY secret exists in the project (it does —
# created per DEPLOY.md step 2). It enables /audit LLM curation and /query
# freeform parsing; /compute works without it.
#
# Cost: min-instances is 0 (scales to zero, $0 at rest) and max-instances is
# 1: the service is stateless (frozen on-disk dataset) and one 512 Mi
# instance handles ~80 concurrent requests — plenty for a prototype.
#
# Same 2nd-gen notes as cloudbuild.yaml: ${VAR} substitution form only, and
# $BUILD_ID (not $COMMIT_SHA) for local submits.

substitutions:
  _SERVICE: ttmf-auditor
  _AR_REPO: ttmf
  _REGION: australia-southeast1
  # Where the auditor pulls its ledger over HTTP. Defaults are empty so a
  # plain `gcloud builds submit . --config backend/cloudbuild.auditor.yaml`
  # keeps today's behaviour (frozen on-disk dataset). To wire it to the
  # deployed BankSync mock, pass both, e.g.:
  #   _BANKSYNC_URL=$(gcloud run services describe ttmf-banksync-mock --region australia-southeast1 --format 'value(status.url)')
  #   _BANKSYNC_KEY=<the _MOCK_KEY you used when deploying ttmf-banksync-mock>

steps:
  - name: gcr.io/cloud-builders/docker
    dir: .
    args:
      [
        "build",
        "-f",
        "backend/Dockerfile.auditor",
        "-t",
        "${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_AR_REPO}/$_SERVICE:$BUILD_ID",
        "--pull",
        ".",
      ]

  - name: gcr.io/cloud-builders/docker
    args: ["push", "${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_AR_REPO}/$_SERVICE:$BUILD_ID"]

  # The old gcr.io/cloud-builders/gcloud image is too stale for this deploy:
  # it accepts --allow-unauthenticated without error but the service ends up
  # with invoker-IAM required (403s). Use the officially recommended
  # cloudsdktool image (requires an explicit `gcloud` entrypoint) with the
  # current --no-invoker-iam-check flag so phones can call without IAM tokens.
  - name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: gcloud
    args:
      [
        "run",
        "deploy",
        "${_SERVICE}",
        "--image",
        "${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_AR_REPO}/$_SERVICE:$BUILD_ID",
        "--region",
        "${_REGION}",
        "--memory",
        "512Mi",
        "--min-instances",
        "0",
        "--max-instances",
        "1",
        "--no-invoker-iam-check",
        "--set-env-vars",
        "BANKSYNC_USE_REMOTE=true,BANKSYNC_BASE_URL=${_BANKSYNC_URL},BANKSYNC_API_KEY=${_BANKSYNC_KEY},BANKSYNC_BANK_ID=demo,BANKSYNC_ACCOUNT_ID=spending",
        "--set-secrets",
        "GEMINI_API_KEY=GEMINI_API_KEY:latest",
      ]
